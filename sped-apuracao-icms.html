<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confronto ICMS × Normas CFOP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef2f8;--c:#fff;--t:#14213d;--m:#5f6b85;--b:#d9e1ee;--p:#1d4ed8;--ph:#e8eefc;--ok:#15803d;--okb:#e3f6ea;--ko:#b91c1c;--kob:#fde8e8;--w:#92400e;--wb:#fff1c9;--hl:#fff3bf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1424;--c:#152038;--t:#e6ecf8;--m:#93a1bd;--b:#273452;--p:#7aa5ff;--ph:#1b2a4d;--ok:#4ade80;--okb:#12301f;--ko:#f87171;--kob:#3a1618;--w:#fbbf24;--wb:#3b2f0c;--hl:#4a3f10}}
:root[data-theme="dark"]{--bg:#0c1424;--c:#152038;--t:#e6ecf8;--m:#93a1bd;--b:#273452;--p:#7aa5ff;--ph:#1b2a4d;--ok:#4ade80;--okb:#12301f;--ko:#f87171;--kob:#3a1618;--w:#fbbf24;--wb:#3b2f0c;--hl:#4a3f10}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:linear-gradient(120deg,#0b2a6f,#1d4ed8);color:#fff;padding:18px 24px}
header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.2px}header p{margin:3px 0 0;opacity:.8;font-size:13px}
main{max-width:1320px;margin:0 auto;padding:18px 16px 40px}
.in{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:14px}
@media(max-width:820px){.in{grid-template-columns:1fr}}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px}
.card h3{margin:0 0 8px;font-size:14px}
textarea{width:100%;height:112px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);padding:8px;font:12px/1.35 Consolas,monospace;resize:vertical}
input[type=file]{width:100%;padding:12px;border:2px dashed var(--b);border-radius:8px;background:var(--bg);color:var(--t)}
button,select{font:inherit;border-radius:7px;border:1px solid var(--b);background:var(--c);color:var(--t);padding:6px 12px;cursor:pointer}
button.pri{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.st{margin-top:6px;font-size:12px;color:var(--m)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.kp .card{padding:10px 14px;border-left:4px solid var(--p)}.kp b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.kp span{color:var(--m);font-size:12px}
.kp .g{border-left-color:var(--ok)}.kp .r{border-left-color:var(--ko)}.kp .a{border-left-color:#d97706}
nav{display:flex;gap:4px;border-bottom:2px solid var(--b);margin-bottom:12px;flex-wrap:wrap}
nav button{border:0;border-radius:8px 8px 0 0;background:none;color:var(--m);padding:9px 16px;font-weight:600}
nav button.on{background:var(--c);color:var(--p);box-shadow:inset 0 -3px var(--p)}
.sc{overflow-x:auto;border:1px solid var(--b);border-radius:10px;background:var(--c)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--ph);color:var(--p);text-align:left;padding:8px 10px;font-size:12px;white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid var(--b);vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap}
tr.ex td{color:var(--m);background:var(--bg);font-style:italic}tr.tot td{font-weight:700;background:var(--ph)}
.neg{color:var(--ko);font-weight:600}.zer{color:var(--ok)}.chg{background:var(--hl);font-weight:700;box-shadow:inset 3px 0 #d97706}
.chg small{display:block;font-weight:600;color:var(--w);font-size:11px}
.bd{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.b-dp{background:var(--kob);color:var(--ko)}.b-pr{background:var(--wb);color:var(--w)}.b-ok{background:var(--okb);color:var(--ok)}.b-n{background:var(--ph);color:var(--p)}
.bx{padding:10px 14px;border-radius:8px;background:var(--wb);color:var(--w);margin:10px 0;font-size:13px}
.ap{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ap div{background:var(--c);border:1px solid var(--b);border-left:4px solid #d97706;border-radius:8px;padding:6px 10px;font-size:12px}
.sch{width:100%;padding:8px 12px;margin-bottom:10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
h2{font-size:15px;margin:18px 0 8px}.mu{color:var(--m)}
</style></head><body>
<header><h1>Confronto ICMS × Normas CFOP</h1><p>PRODAC importado · DP colado · lançamento conferido pela tabela de normas, com o Confronto antes e depois</p></header>
<main>
<div class="in">
 <div class="card"><h3>1. Planilha PRODAC</h3><input type="file" id="fi" accept=".xls,.xlsx,.xlsm,.ods,.csv"><div class="st" id="pi">Importe a consulta de notas de entrada (aba Notas).</div></div>
 <div class="card"><h3>2. Colar DP: Confronto de entradas + blocos de itens por CFOP</h3>
  <textarea id="ta" placeholder="Cole aqui a tela do Confronto (ENTRADAS) e, em seguida, cada bloco 'DP 2 - CFOP: 1.403 / Periodo…' com os itens. Pode colar tudo junto."></textarea>
  <div class="row"><button class="pri" id="go">Analisar</button><button id="cl">Limpar DP</button><span class="st" id="pd"></span></div></div>
</div>
<div id="out"></div>
</main>
<script>
/*CORE*/
const r2=v=>Math.round(v*100)/100,fm=v=>(v<0?'-':'')+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=s=>{if(typeof s=='number')return s;s=String(s==null?'':s).trim();if(!s)return 0;return s.indexOf(',')>=0?(parseFloat(s.replace(/\./g,'').replace(',','.'))||0):(parseFloat(s)||0)};
const grp=c=>String(c).replace(/\D/g,'').padStart(3,'0').slice(-2),cf=c=>String(c).replace(/\D/g,'').slice(0,4);
const NG={'00':'090','20':'090','40':'090','41':'090','90':'090'};
const N=[
{f:'Consumo',c:'1556 2556 1551 2551',g:NG,o:'5101 5102 5108 5117 5929 6101 6102 6108 6117 6929'},
{f:'Consumo',c:'1407 2407 1406 2406',g:{'10':'060','60':'060'},o:'5403 5404 5405 5117 5929 6403 6404 6405 6117 6929 (CST 060/110/160/510/560)'},
{f:'Consumo',c:'1653 2653',g:{'61':'061','60':'061'},o:'5656 6656 5929 6929 (consumo combustível XP Transportes)'},
{f:'Consumo',c:'1949 2949',g:Object.assign({'10':'060','60':'060'},NG),o:'5949 6949 (sem contas a pagar)'},
{f:'Consumo',c:'1908 2908',g:{'40':'090','41':'090'},o:'5908 6908 (CST 040/041)'},
{f:'Consumo',c:'1910 2910 1916 2916 1922 2922',g:NG,o:'5910 6910 5916 6916 5922 6922'},
{f:'Revenda',c:'1102 2102',g:{'00':'000','20':'020','90':'090'},o:'5101 5102 6101 6102 5949 6949 (notas RV, CST 90)'},
{f:'Revenda',c:'1403 2403',g:{'10':'010','30':'030','60':'060'},o:'5405 6405 (CST 010/110/510→010 · 030/130/530→030 · 060/160/560→060)'},
{f:'Revenda',c:'1652 2652',g:{'10':null,'30':null,'60':null,'61':null},o:'5655 5656 6656 (verificar nota e CST)'},
{f:'Revenda',c:'1152 2152',g:{'00':'000'},o:'5152 6152 (transferência Arla)'},
{f:'Revenda',c:'1659 2659',g:{'60':'060'},o:'5659 6659 (transferência lubrificante)'}];
const NM={};N.forEach(r=>r.c.split(' ').forEach(c=>NM[c]=r));
const chk=(c,cst)=>{const r=NM[c],g=grp(cst);if(!r)return{s:'sem'};if(!(g in r.g))return{s:'fora'};const k=r.g[g];if(k===null)return{s:'ver'};if(String(cst).replace(/\D/g,'').padStart(3,'0')!==k)return{s:'cst',to:k};return{s:'ok'}};
const alvo=(c,cst)=>{const r0=NM[c];if(!r0)return null;const g=grp(cst),h=N.find(r=>r.f==r0.f&&g in r.g&&r.c.split(' ').some(x=>x[0]==c[0]));return h?h.c.split(' ').find(x=>x[0]==c[0]):null};
function sub(arr,al){al=r2(al);const a=arr.filter(x=>x.v>0).slice(0,18),n=a.length;let best=null;
 for(let m=1;m<(1<<n);m++){let s=0,k=0;for(let i=0;i<n;i++)if(m>>i&1){s+=a[i].v;k++}if(Math.abs(s-al)<.005&&(!best||k<best.k))best={k,m}}
 return best?a.filter((_,i)=>best.m>>i&1):null}
function parseDP(t){const conf={},blocks={},meta={};let sec='',cur=null;
 const e=t.match(/CNPJ:\s*\n?\s*([\d./-]+)/);if(e)meta.cnpj=e[1];const em=t.match(/Empresa:\s*\n?\s*([^\n\t]+)/);if(em)meta.emp=em[1].trim();
 for(const raw of t.split(/\r?\n/)){const l=raw.replace(/\s+$/,'');
  if(/^\s*ENTRADAS\s*$/.test(l)){sec='E';continue}
  if(/^\s*SA[ÍI]DAS\s*$/.test(l)){sec='S';continue}
  const h=l.match(/CFOP:\s*([\d.]+)\s*\/\s*Per[ií]odo:\s*(\d\d)\/(\d\d)\/(\d{4})/);
  if(h){sec='B';cur=cf(h[1]);blocks[cur]=[];meta.mes=h[3]+'/'+h[4];continue}
  if(sec=='E'){if(/SUB-TOTAIS/.test(l)){sec='';continue}const m=l.match(/^\s*(\d{4})\t(.+)$/);if(m){const n=m[2].split('\t').map(num);if(n.length>=2)conf[m[1]]={pc:n[0],dc:n[1]}}continue}
  if(sec=='B'&&cur){if(/^\s*Total\b/.test(l)){sec='';continue}
   let p=l.split('\t');if(p.length<12)p=l.split(/\s{2,}/);
   if(p.length>=12&&/^\d\d\/\d\d\/\d{4}$/.test(p[0].trim()))blocks[cur].push({dt:p[0].trim(),forn:p[1].trim(),nf:String(+p[2]),cst:p[4].trim(),desc:p[5].trim(),valor:num(p[6]),dsc:num(p[7]),frete:num(p[8]),ipi:num(p[10]),st:num(p[11])})}}
 return{conf,blocks,meta}}
function parsePR(wb){const a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
 const hi=a.findIndex(r=>r.indexOf('Número Nota')>=0);if(hi<0)return[];const h=a[hi],ix=n=>h.indexOf(n);
 return a.slice(hi+1).filter(r=>String(r[ix('Número Nota')]).trim()&&cf(r[ix('CFOP')])).map(r=>({nf:String(+String(r[ix('Número Nota')]).trim()),cfop:cf(r[ix('CFOP')]),valor:num(r[ix('Valor Contábil')]),forn:String(r[ix('Razão Social')]).trim(),canc:/^S/i.test(String(r[ix('Cancel')]).trim())}))}
const nomeOk=(a,b)=>a.replace(/[^A-Z]/gi,'').toUpperCase().slice(0,5)==b.replace(/[^A-Z]/gi,'').toUpperCase().slice(0,5);
function analisar(DP,PR){const F=[],NFR=[],ITS=[],dpk=[];const prBy={};PR.forEach(r=>{if(!r.canc)(prBy[r.nf]=prBy[r.nf]||[]).push(r)});
 const add=f=>{f.sel='A';F.push(f)};
 for(const B in DP.blocks){const its=DP.blocks[B],nfs={};
  its.forEach(i=>{i.base=r2(i.valor-i.dsc+i.frete+i.ipi);const g=grp(i.cst);i.stIn=['10','30','70'].includes(g)?i.st:0;i.stRet=r2(i.st-i.stIn);i.dpv=r2(i.base+i.stIn);(nfs[i.nf+'|'+i.forn]=nfs[i.nf+'|'+i.forn]||[]).push(i)});
  let rule=0;
  for(const k in nfs){const L=nfs[k],nf=L[0].nf,forn=L[0].forn,dpv=r2(L.reduce((s,i)=>s+i.dpv,0));rule+=dpv;dpk.push({nf,forn});
   const pr=(prBy[nf]||[]).filter(r=>nomeOk(r.forn,forn)),prB=pr.filter(r=>r.cfop==B),pB=r2(prB.reduce((s,r)=>s+r.valor,0));
   const base={cfop:B,nf,forn};let stt='ok';
   L.forEach(i=>{const c=chk(B,i.cst);i.n=c;ITS.push(Object.assign({B,nf,forn},i))});
   const bad=L.filter(i=>i.n.s=='fora');
   bad.forEach(i=>{const T=alvo(B,i.cst),pv=pB?i.dpv:0;add(Object.assign({},base,{tipo:'CFOP fora da norma',it:i.desc,cst:i.cst,v:i.dpv,sug:pB?'B':'D',
     mot:'CST '+i.cst+' não é aceito no CFOP '+B+(T?'. Norma: lançar no '+T:''),
     ac:{D:T?[{c:'D',f:B,d:-i.dpv},{c:'D',f:T,d:i.dpv}]:[],P:T&&pv?[{c:'P',f:B,d:-pv},{c:'P',f:T,d:pv}]:[]}}));stt='x'});
   const cs={};L.filter(i=>i.n.s=='cst').forEach(i=>{const q=i.cst+'→'+i.n.to;(cs[q]=cs[q]||[]).push(i)});
   for(const q in cs)add(Object.assign({},base,{tipo:'CST a ajustar',it:cs[q].map(i=>i.desc).join(' · '),cst:q,v:r2(cs[q].reduce((s,i)=>s+i.dpv,0)),sug:'D',mot:'Norma pede lançar com CST '+q.split('→')[1]+' (AutoSystem); não altera valor',ac:{D:[],P:[]}}));
   if(!pr.length){add(Object.assign({},base,{tipo:'NF só no DP',it:'NF inteira',v:dpv,sug:'P',mot:'Não consta no PRODAC; lançar na Contabilidade',ac:{P:[{c:'P',f:B,d:dpv}],D:[{c:'D',f:B,d:-dpv}]}}));stt='x'}
   else if(!prB.length){const r=pr.slice().sort((a,b)=>Math.abs(a.valor-dpv)-Math.abs(b.valor-dpv))[0],A=r.cfop,gs=L.map(i=>grp(i.cst));
    const okA=NM[A]?gs.every(g=>g in NM[A].g):null,okB=NM[B]?gs.every(g=>g in NM[B].g):null;
    add(Object.assign({},base,{tipo:'CFOP divergente',it:'NF inteira (CST '+[...new Set(L.map(i=>i.cst))].join('/')+')',v:r.valor,sug:okB&&okA===false?'P':okA&&okB===false?'D':null,
     mot:'PRODAC lançou no '+A+' · DP no '+B+(okA===false?' · '+A+' não aceita esse CST':'')+(okB===false?' · '+B+' não aceita esse CST':''),
     ac:{P:[{c:'P',f:A,d:-r.valor},{c:'P',f:B,d:r.valor}],D:[{c:'D',f:B,d:-dpv},{c:'D',f:A,d:dpv}]}}));stt='x'}
   else{const gap=r2(pB-dpv);if(gap!==0){let s=null,mot;
     if(gap>0){s=sub(L.map(i=>({v:i.stRet,i})),gap);mot='PRODAC somou ST de itens CST 060/061 (ST retido anteriormente, fora do total da nota)'}
     else{s=sub(L.map(i=>({v:i.stIn,i})),-gap);mot='PRODAC não somou ST de itens CST 010/030 (ST cobrado na nota)'}
     add(Object.assign({},base,{tipo:'Valor da NF (ST)',it:s?s.map(x=>x.i.desc+' ['+x.i.cst+']').join(' · '):'item não localizado',v:Math.abs(gap),sug:s?'P':null,mot:s?mot:'Diferença sem item identificado',
      ac:{P:[{c:'P',f:B,d:-gap}],D:[{c:'D',f:B,d:gap}]}}));stt='x'}}
   NFR.push({B,nf,forn,dpv,pB,pc:pr.map(r=>r.cfop+' '+fm(r.valor)).join(' + ')||'—',stt})}
  const cn=DP.conf[B];
  if(cn){const g=r2(rule-cn.dc);if(g!==0){let s,mot;
    if(g>0){s=sub(its.map(i=>({v:i.stIn,i})),g);mot='DP não somou o ST (CST 010/030, cobrado na nota) no Confronto'}
    else{s=sub(its.map(i=>({v:i.stRet,i})),-g);mot='DP somou ST de item CST 060/061 (retido anteriormente)'}
    const by={};(s||[]).forEach(x=>(by[x.i.nf+'|'+x.i.forn]=by[x.i.nf+'|'+x.i.forn]||[]).push(x));
    if(!s)add({cfop:B,nf:'—',forn:'',tipo:'Valor do DP (Confronto)',it:'item não localizado',v:Math.abs(g),sug:null,mot:'Diferença sem item identificado',ac:{D:[{c:'D',f:B,d:-g}],P:[]}});
    for(const k in by){const x=by[k],t=r2(x.reduce((q,y)=>q+y.v,0));add({cfop:B,nf:x[0].i.nf,forn:x[0].i.forn,tipo:'Valor do DP (ST)',it:x.map(y=>y.i.desc+' ['+y.i.cst+']').join(' · '),v:t,sug:'D',mot:mot,ac:{D:[{c:'D',f:B,d:g>0?t:-t}],P:[]}})}}}}
 PR.forEach(r=>{if(r.canc||!DP.blocks[r.cfop])return;if(dpk.some(d=>d.nf==r.nf&&nomeOk(d.forn,r.forn)))return;
  add({cfop:r.cfop,nf:r.nf,forn:r.forn,tipo:'NF só no PRODAC',it:'NF inteira',v:r.valor,sug:'D',mot:'Não consta no bloco do DP; lançar no AutoSystem',ac:{D:[{c:'D',f:r.cfop,d:r.valor}],P:[{c:'P',f:r.cfop,d:-r.valor}]}})});
 return{F,NFR,ITS}}
function efet(f){const e=f.sel=='A'?(f.sug||'N'):f.sel;return e=='D'?f.ac.D:e=='P'?f.ac.P:e=='B'?f.ac.P.concat(f.ac.D):[]}
function aplicar(conf,F){const o={};for(const k in conf)o[k]={pc:conf[k].pc,dc:conf[k].dc,xp:0,xd:0};
 F.forEach(f=>efet(f).forEach(m=>{const x=o[m.f]=o[m.f]||{pc:0,dc:0,xp:0,xd:0};if(m.c=='P'){x.pc=r2(x.pc+m.d);x.xp=r2(x.xp+m.d)}else{x.dc=r2(x.dc+m.d);x.xd=r2(x.xd+m.d)}}));return o}
/*END*/
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EX=['1933','2933'];let DP=null,PR=[],R=null,aba='c',q='';
const dif=(a,b)=>{const d=r2(a-b);return'<span class="'+(d?'neg':'zer')+'">'+fm(d)+'</span>'};
function run(){const o=$('#out');if(!DP||!Object.keys(DP.conf).length||!PR.length){o.innerHTML='<div class="bx">Importe a planilha PRODAC e cole o DP (Confronto + blocos de itens) para analisar.</div>';return}
 R=R&&R.k==PR.length+'|'+$('#ta').value.length?R:Object.assign(analisar(DP,PR),{k:PR.length+'|'+$('#ta').value.length});draw()}
function pill(s){return s=='D'?'<span class="bd b-dp">DP · AutoSystem</span>':s=='P'?'<span class="bd b-pr">PRODAC · Contabilidade</span>':s=='B'?'<span class="bd b-dp">DP + PRODAC</span>':'<span class="bd b-n">a definir</span>'}
function draw(){const{F,NFR,ITS}=R,A=aplicar(DP.conf,F),ks=Object.keys(DP.conf).sort();
 const pcS={};PR.forEach(r=>{if(!r.canc)pcS[r.cfop]=r2((pcS[r.cfop]||0)+r.valor)});
 let ia=0,ib=0,ic=0;ks.forEach(k=>{if(EX.includes(k))return;const c=DP.conf[k],a=A[k];ia+=Math.abs(r2(c.pc-c.dc));ib+=Math.abs(r2(a.pc-a.dc));if(Math.abs(a.xp)+Math.abs(a.xd)>0)ic++});
 const ef=F.filter(f=>efet(f).length||f.tipo=='CST a ajustar'),nD=F.filter(f=>(f.sel=='A'?f.sug:f.sel)=='D').length,nP=F.filter(f=>(f.sel=='A'?f.sug:f.sel)=='P').length;
 let h='<div class="kp"><div class="card r"><b>'+fm(r2(ia))+'</b><span>Diferença antes (soma por CFOP)</span></div><div class="card '+(ib?'a':'g')+'"><b>'+fm(r2(ib))+'</b><span>Diferença depois dos ajustes</span></div><div class="card"><b>'+F.length+'</b><span>Ajustes encontrados ('+nD+' no DP · '+nP+' no PRODAC)</span></div><div class="card"><b>'+ic+'</b><span>CFOPs corrigidos no Confronto</span></div><div class="card"><b>'+ITS.length+'</b><span>Itens do DP em '+Object.keys(DP.blocks).length+' CFOPs · '+PR.length+' notas PRODAC</span></div></div>';
 h+='<nav>'+[['c','Confronto antes × depois'],['a','Ajustes ('+F.length+')'],['n','Notas e itens'],['t','Tabela de normas']].map(x=>'<button class="'+(aba==x[0]?'on':'')+'" data-a="'+x[0]+'">'+x[1]+'</button>').join('')+'</nav>';
 if(aba=='c'){h+='<div class="sc"><table><thead><tr><th>CFOP</th><th class="n">PRODAC antes</th><th class="n">DP antes</th><th class="n">Dif. antes</th><th class="n">PRODAC depois</th><th class="n">DP depois</th><th class="n">Dif. depois</th><th class="n">PRODAC planilha</th></tr></thead><tbody>';
  let t=[0,0,0,0];ks.forEach(k=>{const c=DP.conf[k],a=A[k],ex=EX.includes(k),pl=pcS[k]||0;if(!ex){t[0]+=c.pc;t[1]+=c.dc;t[2]+=a.pc;t[3]+=a.dc}
   const cell=(v,x)=>'<td class="n '+(x?'chg':'')+'">'+fm(v)+(x?'<small>'+(x>0?'+':'')+fm(x)+'</small>':'')+'</td>';
   h+='<tr class="'+(ex?'ex':'')+'"><td><b>'+k+'</b>'+(ex?' <span class="bd b-n">fora do Confronto</span>':'')+'</td><td class="n">'+fm(c.pc)+'</td><td class="n">'+fm(c.dc)+'</td><td class="n">'+dif(c.pc,c.dc)+'</td>'+cell(a.pc,a.xp)+cell(a.dc,a.xd)+'<td class="n">'+dif(a.pc,a.dc)+'</td><td class="n '+(Math.abs(pl-c.pc)>.005?'neg':'')+'" title="Soma da planilha por CFOP">'+fm(pl)+'</td></tr>'});
  h+='<tr class="tot"><td>Total</td><td class="n">'+fm(r2(t[0]))+'</td><td class="n">'+fm(r2(t[1]))+'</td><td class="n">'+dif(t[0],t[1])+'</td><td class="n">'+fm(r2(t[2]))+'</td><td class="n">'+fm(r2(t[3]))+'</td><td class="n">'+dif(t[2],t[3])+'</td><td></td></tr></tbody></table></div>';
  h+='<h2>Onde corrigiu</h2><div class="ap">'+(ef.filter(f=>efet(f).length).map(f=>{const e=f.sel=='A'?f.sug:f.sel;return'<div><b>'+f.cfop+'</b> · NF '+esc(f.nf)+' · '+pill(e)+' · '+(f.tipo.indexOf('CFOP')==0||f.tipo.indexOf('NF')==0?esc(f.tipo)+' '+fm(f.v):efet(f).map(m=>(m.c=='P'?'PRODAC ':'DP ')+m.f+' '+(m.d>0?'+':'')+fm(m.d)).join(' · '))+'<br><span class="mu">'+esc(f.it.length>110?f.it.slice(0,110)+'…':f.it)+'</span></div>'}).join('')||'<span class="mu">Nenhum ajuste de valor aplicado.</span>')+'</div>';
  const pend=ks.filter(k=>!EX.includes(k)&&!DP.blocks[k]&&Math.abs(r2(A[k].pc-A[k].dc))>.005);
  if(pend.length)h+='<div class="bx">CFOPs com diferença sem bloco de itens colado: <b>'+pend.join(', ')+'</b>. Cole o bloco desses CFOPs para localizar a nota e o item.</div>';
  if(ib)h+='<div class="bx">Ainda restam diferenças depois dos ajustes. Veja a aba Ajustes: itens com ação "a definir" aceitam DP ou PRODAC.</div>'}
 else if(aba=='a'){h+='<input class="sch" id="sq" placeholder="Filtrar por NF, CFOP, emitente, item ou tipo…" value="'+esc(q)+'"><div class="sc"><table><thead><tr><th>CFOP</th><th>NF</th><th>Emitente</th><th>Tipo</th><th>Item</th><th class="n">Valor</th><th>Erro em</th><th>Motivo</th><th>Aplicar em</th></tr></thead><tbody>';
  F.forEach((f,i)=>{const tx=(f.cfop+f.nf+f.forn+f.tipo+f.it).toLowerCase();if(q&&tx.indexOf(q.toLowerCase())<0)return;const e=f.sel=='A'?f.sug:f.sel;
   h+='<tr><td><b>'+f.cfop+'</b></td><td>'+esc(f.nf)+'</td><td>'+esc(f.forn)+'</td><td>'+esc(f.tipo)+'</td><td style="max-width:300px">'+esc(f.it)+'</td><td class="n">'+fm(f.v)+'</td><td>'+pill(e)+'</td><td style="max-width:300px">'+esc(f.mot)+'</td><td><select data-i="'+i+'">'+[['A','Sugerido'],['D','DP'],['P','PRODAC'],['B','Ambos'],['N','Não aplicar']].map(o=>'<option value="'+o[0]+'"'+(f.sel==o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></td></tr>'});
  h+='</tbody></table></div>'}
 else if(aba=='n'){h+='<input class="sch" id="sq" placeholder="Filtrar por NF, CFOP, emitente, item ou CST…" value="'+esc(q)+'"><h2>Notas</h2><div class="sc"><table><thead><tr><th>CFOP DP</th><th>NF</th><th>Emitente</th><th>PRODAC (CFOP e valor)</th><th class="n">PRODAC no CFOP</th><th class="n">DP calculado</th><th class="n">Dif.</th></tr></thead><tbody>';
  NFR.forEach(n=>{if(q&&(n.B+n.nf+n.forn).toLowerCase().indexOf(q.toLowerCase())<0)return;h+='<tr><td><b>'+n.B+'</b></td><td>'+esc(n.nf)+'</td><td>'+esc(n.forn)+'</td><td>'+n.pc+'</td><td class="n">'+fm(n.pB)+'</td><td class="n">'+fm(n.dpv)+'</td><td class="n">'+dif(n.pB,n.dpv)+'</td></tr>'});
  h+='</tbody></table></div><h2>Itens do DP × norma</h2><div class="sc"><table><thead><tr><th>CFOP</th><th>NF</th><th>Item</th><th>CST</th><th>Norma</th><th class="n">Valor</th><th class="n">Desc.</th><th class="n">ST</th><th class="n">DP calculado</th></tr></thead><tbody>';
  ITS.forEach(i=>{if(q&&(i.B+i.nf+i.forn+i.desc+i.cst).toLowerCase().indexOf(q.toLowerCase())<0)return;const s=i.n.s,b=s=='ok'?'<span class="bd b-ok">na norma</span>':s=='cst'?'<span class="bd b-pr">CST → '+i.n.to+'</span>':s=='fora'?'<span class="bd b-dp">fora da norma</span>':s=='ver'?'<span class="bd b-n">verificar nota</span>':'<span class="bd b-n">CFOP sem norma</span>';
   h+='<tr><td><b>'+i.B+'</b></td><td>'+esc(i.nf)+'</td><td>'+esc(i.desc)+'</td><td>'+esc(i.cst)+'</td><td>'+b+'</td><td class="n">'+fm(i.valor)+'</td><td class="n">'+fm(i.dsc)+'</td><td class="n">'+fm(i.st)+'</td><td class="n">'+fm(i.dpv)+'</td></tr>'});
  h+='</tbody></table></div>'}
 else{h+='<div class="sc"><table><thead><tr><th>Família</th><th>CFOP lançado</th><th>CST aceito → CST lançado</th><th>CFOP de origem (fornecedor)</th></tr></thead><tbody>'+N.map(r=>'<tr><td><b>'+r.f+'</b></td><td>'+r.c.replace(/ /g,' · ')+'</td><td>'+Object.keys(r.g).map(g=>g+(r.g[g]?'→'+r.g[g]:'')).join(' · ')+'</td><td>'+r.o+'</td></tr>').join('')+'</tbody></table></div><p class="mu">CST 010/030/070 compõem o valor da nota com o ST; CST 060/061 têm ST retido anteriormente, fora do total. CFOPs 1933 e 2933 ficam fora do Confronto.</p>'}
 $('#out').innerHTML=h}
document.addEventListener('click',e=>{const b=e.target.closest('nav button');if(b){aba=b.dataset.a;draw()}});
document.addEventListener('change',e=>{if(e.target.dataset.i!=null){R.F[+e.target.dataset.i].sel=e.target.value;draw()}});
document.addEventListener('input',e=>{if(e.target.id=='sq'){q=e.target.value;const p=e.target.selectionStart;draw();const s=$('#sq');s.focus();s.setSelectionRange(p,p)}});
$('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});PR=parsePR(wb);$('#pi').textContent=f.name+' · '+PR.length+' notas lidas';R=null;run()}catch(x){$('#pi').textContent='Não consegui ler o arquivo: '+x.message}};
function ler(){DP=parseDP($('#ta').value);const n=Object.keys(DP.blocks);$('#pd').textContent=Object.keys(DP.conf).length+' CFOPs no Confronto · '+n.length+' blocos de itens'+(n.length?' ('+n.join(', ')+')':'');R=null;run()}
$('#go').onclick=ler;$('#cl').onclick=()=>{$('#ta').value='';DP=null;R=null;$('#pd').textContent='';run()};
$('#ta').addEventListener('paste',()=>setTimeout(ler,50));
run();
</script></body></html>
