<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPED – Resumo de Entradas e Saídas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6e8fb; --card:#ffffff; --ink:#1c2033; --muted:#6b7190; --line:#d5d8ee;
  --head:#2a3050; --headink:#fff; --zebra:#f4f5fd; --acc:#2f8cff; --accsoft:#e3efff;
  --ok:#17a673; --warn:#d98a00;
  --stage:#1d2029; --stage2:#14161d;
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0d0f18; --card:#151929; --ink:#e8ebfa; --muted:#8c92b3; --line:#262b45;
  --head:#232b4d; --headink:#eef1ff; --zebra:#1a1f33; --acc:#4aa8ff; --accsoft:#1b2a45;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;transition:background .4s,color .4s;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:clamp(22px,3.2vw,30px);margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 22px;font-size:14.5px}

/* ---------- STAGE ---------- */
.stage{
  position:relative;height:290px;border-radius:38px;background:var(--stage);overflow:hidden;
  box-shadow:0 30px 60px -20px rgba(20,22,50,.55), inset 0 2px 0 rgba(255,255,255,.04), inset 0 -18px 40px rgba(0,0,0,.35);
  transition:transform .3s, box-shadow .3s; user-select:none;
}
.stage.drag{transform:scale(1.012);box-shadow:0 30px 70px -18px rgba(74,168,255,.55),0 0 0 2px rgba(74,168,255,.7), inset 0 -18px 40px rgba(0,0,0,.35)}
.floor{position:absolute;left:28px;right:28px;bottom:50px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.09) 12%,rgba(255,255,255,.09) 88%,transparent)}
.moon{
  position:absolute;left:5%;bottom:30px;width:88px;height:88px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#2a2e3c,#1a1d27);
  box-shadow:8px 10px 20px rgba(0,0,0,.55),-4px -4px 12px rgba(255,255,255,.04), inset 0 0 0 1px rgba(255,255,255,.03);
  display:grid;place-items:center;transition:transform .15s, box-shadow .2s;
}
.moon:active{transform:scale(.94);box-shadow:3px 4px 8px rgba(0,0,0,.6), inset 3px 3px 10px rgba(0,0,0,.5)}
.moon:focus-visible,.pick:focus-visible,.cesta:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.moon svg{width:40px;height:40px;filter:drop-shadow(0 0 8px rgba(74,168,255,.7));transition:transform .5s}
:root[data-theme="light"] .moon svg{transform:rotate(360deg);filter:drop-shadow(0 0 8px rgba(255,190,60,.8))}
.moon .sun{display:none}
:root[data-theme="light"] .moon .sun{display:block}
:root[data-theme="light"] .moon .crescent{display:none}

.hint{position:absolute;top:26px;left:30px;color:#c9cfee;font-size:14px;line-height:1.45;max-width:46%}
.hint b{color:#fff;font-weight:700;display:block;font-size:16px;margin-bottom:2px}
.pick{
  position:absolute;top:22px;right:26px;display:flex;align-items:center;gap:10px;border:0;cursor:pointer;
  background:#272b3a;color:#e8ecff;font:600 14px 'Manrope',sans-serif;padding:11px 16px 11px 12px;border-radius:999px;
  box-shadow:5px 6px 14px rgba(0,0,0,.45),-3px -3px 8px rgba(255,255,255,.035);transition:transform .15s,background .2s;
}
.pick:hover{background:#2f3447}.pick:active{transform:scale(.96)}
.pick svg{width:22px;height:22px;color:var(--acc)}

/* cesta */
.cesta{
  position:absolute;right:6%;bottom:42px;width:clamp(150px,22vw,210px);cursor:pointer;background:none;border:0;padding:0;
  transform-origin:50% 100%;
}
.cesta svg{display:block;width:100%;height:auto;overflow:visible}
.cesta .glow{opacity:0;transition:opacity .25s}
.stage.drag .cesta .glow{opacity:1}
.stage.drag .cesta{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px) rotate(-2deg)}}
.cesta.shake{animation:shake 1.1s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  0%{transform:scale(1,1)} 8%{transform:scale(1.05,.9)} 18%{transform:rotate(-10deg) scale(1)}
  32%{transform:rotate(9deg)} 46%{transform:rotate(-7deg)} 60%{transform:rotate(5deg)}
  74%{transform:rotate(-3deg)} 88%{transform:rotate(1.5deg)} 100%{transform:rotate(0)}
}

/* hominho */
.man{position:absolute;bottom:50px;left:20%;width:52px;height:88px;z-index:3;pointer-events:none}
.flip{width:100%;height:100%;transform-origin:50% 50%;transition:none}
.man svg{width:100%;height:100%;overflow:visible}
.man line,.man .stroke{stroke:#fff;stroke-width:4;stroke-linecap:round;fill:none}
.man .arm{transform-origin:30px 28px;transition:transform .25s}
.man .leg{transform-origin:30px 58px}
.man.walking .l1,.man.walking .a2{animation:swing .52s ease-in-out infinite alternate}
.man.walking .l2,.man.walking .a1{animation:swing .52s ease-in-out infinite alternate-reverse}
.man.running .l1,.man.running .a2{animation-duration:.26s}
.man.running .l2,.man.running .a1{animation-duration:.26s}
.man.running svg{transform:rotate(7deg)}
@keyframes swing{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
.man.cheer .a1{transform:rotate(155deg)}
.man.cheer .a2{transform:rotate(-155deg)}
.man.cheer svg{animation:hop .42s ease-out 3}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px)}}
.man.look .head{animation:nod 1.6s ease-in-out infinite}
@keyframes nod{50%{transform:translateY(1.5px)}}

.chip{position:fixed;left:0;top:0;width:54px;height:66px;margin:-33px 0 0 -27px;z-index:50;pointer-events:none;
  background:#fff;border-radius:8px 18px 8px 8px;box-shadow:0 10px 24px rgba(0,0,0,.4);display:grid;place-items:center;
  font:800 13px 'Manrope',sans-serif;color:#2f8cff}
.chip::before{content:"";position:absolute;right:0;top:0;width:18px;height:18px;background:linear-gradient(225deg,#cfe3ff 50%,#9cc3ff 50%);border-radius:0 0 0 8px}
.chip::after{content:"";position:absolute;left:10px;right:10px;bottom:11px;height:3px;border-radius:2px;background:#cdd5ee;box-shadow:0 -7px 0 #cdd5ee,0 -14px 0 #cdd5ee}

.status{display:flex;align-items:center;gap:10px;margin:16px 4px 0;color:var(--muted);font-size:14px;min-height:22px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.status.busy .dot{background:var(--warn);animation:pulse 1s infinite}
.status.ok .dot{background:var(--ok)}
.status.err .dot{background:#e5484d}.status.err{color:#e5484d}
@keyframes pulse{50%{opacity:.25}}

/* ---------- RESULTADOS ---------- */
#result{display:none;margin-top:30px}
#result.show{display:block;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.company{background:var(--card);border-radius:24px;padding:22px 26px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;
  box-shadow:0 12px 30px -16px rgba(30,35,80,.35);border:1px solid var(--line)}
.company h2{margin:0;font-size:clamp(20px,3vw,27px);font-weight:800;letter-spacing:-.02em}
.company .unit{color:var(--acc);font-weight:700;margin-top:3px;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:14px;color:var(--muted);font-size:13.5px}
.meta span b{color:var(--ink);font-weight:600;margin-left:4px}
.tag{display:inline-block;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;background:var(--accsoft);color:var(--acc)}
.tag.ret{background:#fff0d6;color:#a86400}
:root[data-theme="dark"] .tag.ret{background:#3a2c10;color:#ffc766}
.company .right{text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fname{font-size:12px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.totals{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.tot{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.tot h3{margin:0 0 2px;font-size:14px;color:var(--muted);font-weight:600}
.tot .big{font-size:24px;font-weight:800;letter-spacing:-.02em}
.tot .s{font-size:13px;color:var(--muted);text-align:right;line-height:1.6}
.tot .s b{color:var(--ink)}
.tot.in{border-left:5px solid #3ac28b}.tot.out{border-left:5px solid var(--acc)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 12px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:999px}
.tab{border:0;background:none;color:var(--muted);font:700 14px 'Manrope',sans-serif;padding:9px 18px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.tab.on{background:var(--head);color:var(--headink)}
.sp{flex:1}
.search{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:10px 16px;font:500 14px 'Manrope',sans-serif;width:190px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 13.5px 'Manrope',sans-serif;border-radius:999px;padding:10px 16px;cursor:pointer;transition:transform .12s,border-color .2s}
.btn:hover{border-color:var(--acc)}.btn:active{transform:scale(.96)}

.report{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 30px -16px rgba(30,35,80,.35)}
.rtitle{background:var(--head);color:var(--headink);padding:15px 22px;font-weight:800;font-size:15px;letter-spacing:-.005em;line-height:1.35}
.rmeta{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 28px;font-size:13px;color:var(--muted)}
.rmeta b{color:var(--ink);font-weight:700}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th{background:color-mix(in srgb,var(--head) 14%,var(--card));color:var(--ink);font-weight:700;font-size:12.5px;padding:12px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:22px}
td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line)}
tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:var(--accsoft)}
td.z{color:var(--muted);opacity:.55}
td.k{text-align:center;font-weight:700}
th.c{text-align:center}
td.cfop{font-weight:800;text-align:center}
tfoot td{font-weight:800;border-top:2px solid var(--head);background:color-mix(in srgb,var(--head) 10%,var(--card))!important;border-bottom:0}
.empty{padding:34px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:12.5px;margin:12px 6px 0}

.apu{padding:8px 0}
.apu .row{display:flex;justify-content:space-between;gap:18px;padding:11px 22px;border-bottom:1px solid var(--line);font-size:14px}
.apu .row span{color:var(--muted)}.apu .row b{font-weight:800}
.apu .row.hi{background:var(--accsoft)}
.sec{padding:14px 22px 6px;font-weight:800;font-size:14px}

@media (max-width:720px){
  .stage{height:260px;border-radius:30px}.hint{max-width:56%;font-size:12.5px}.hint b{font-size:14px}
  .pick span{display:none}.pick{padding:11px}.moon{width:68px;height:68px}.moon svg{width:30px;height:30px}
  .company{grid-template-columns:1fr}.company .right{align-items:flex-start;text-align:left}
  .totals{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.stage.drag .cesta{animation:none}#result.show{animation:none}}
@media print{
  body{background:#fff;color:#000}.stage,.status,.bar,.note,.sub,h1{display:none!important}
  .report,.company,.tot{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Resumo fiscal do SPED</h1>
  <p class="sub">Entradas e saídas montadas direto do arquivo .txt, no formato dos registros fiscais.</p>

  <div class="stage" id="stage">
    <button class="moon" id="theme" title="Alternar tema claro/escuro" aria-label="Alternar tema">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path class="crescent" d="M26 5.5A15.5 15.5 0 1 0 34.5 27 12.5 12.5 0 0 1 26 5.5Z" fill="#4aa8ff"/>
        <g class="sun" stroke="#ffbe3c" stroke-width="3" stroke-linecap="round" fill="none">
          <circle cx="20" cy="20" r="7" fill="#ffbe3c" stroke="none"/>
          <path d="M20 4v4M20 32v4M4 20h4M32 20h4M8.7 8.7l2.8 2.8M28.5 28.5l2.8 2.8M31.3 8.7l-2.8 2.8M11.5 28.5l-2.8 2.8"/>
        </g>
      </svg>
    </button>

    <div class="hint"><b>Jogue o SPED na cesta</b>Arraste o arquivo .txt até aqui, ou use o botão de importar.</div>

    <button class="pick" id="pick" title="Importar arquivo SPED">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      <span>Importar SPED</span>
    </button>
    <input type="file" id="file" accept=".txt,text/plain" hidden>

    <div class="floor"></div>

    <div class="man walking" id="man"><div class="flip" id="flip">
      <svg viewBox="0 0 60 100" aria-hidden="true">
        <circle class="head" cx="30" cy="13" r="8.5" fill="#fff"/>
        <line x1="30" y1="22" x2="30" y2="58"/>
        <g class="arm a1"><line x1="30" y1="28" x2="30" y2="52"/></g>
        <g class="arm a2"><line x1="30" y1="28" x2="30" y2="52"/></g>
        <g class="leg l1"><line x1="30" y1="58" x2="30" y2="90"/></g>
        <g class="leg l2"><line x1="30" y1="58" x2="30" y2="90"/></g>
      </svg>
    </div></div>

    <button class="cesta" id="cesta" aria-label="Cesta: clique para escolher o arquivo SPED">
      <svg viewBox="0 0 210 190" aria-hidden="true">
        <defs>
          <clipPath id="body"><path d="M26 52 L44 168 Q45 180 58 180 L152 180 Q165 180 166 168 L184 52 Z"/></clipPath>
          <linearGradient id="wv" x1="0" x2="1"><stop offset="0" stop-color="#2c3142"/><stop offset=".5" stop-color="#363c52"/><stop offset="1" stop-color="#262a39"/></linearGradient>
        </defs>
        <ellipse class="glow" cx="105" cy="52" rx="96" ry="26" fill="rgba(74,168,255,.35)" style="filter:blur(10px)"/>
        <ellipse id="rim" cx="105" cy="52" rx="80" ry="17" fill="#07080c" stroke="#4aa8ff" stroke-opacity=".55" stroke-width="2"/>
        <g clip-path="url(#body)">
          <path d="M20 40 H190 V190 H20Z" fill="url(#wv)"/>
          <g stroke="#454c66" stroke-width="3" fill="none" opacity=".9">
            <path d="M20 78 Q105 96 190 78"/><path d="M20 108 Q105 126 190 108"/><path d="M20 138 Q105 156 190 138"/><path d="M20 168 Q105 186 190 168"/>
          </g>
          <g stroke="#202433" stroke-width="3" opacity=".9">
            <path d="M52 60 L66 190M78 62 L88 190M104 64 V190M130 62 L122 190M156 60 L144 190"/>
          </g>
        </g>
        <path d="M25 52 Q105 100 185 52" fill="none" stroke="#4a5272" stroke-width="9" stroke-linecap="round"/>
        <path d="M25 52 Q105 100 185 52" fill="none" stroke="#6b75a0" stroke-width="2" stroke-linecap="round" opacity=".6" transform="translate(0,-2)"/>
        <text x="105" y="140" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="19" letter-spacing="4" fill="#4aa8ff" opacity=".9">SPED</text>
      </svg>
    </button>
  </div>
  <div class="status" id="status"><span class="dot"></span><span id="stxt">Aguardando o arquivo SPED Fiscal (.txt)</span></div>

  <section id="result">
    <div class="company">
      <div>
        <h2 id="cName"></h2>
        <div class="unit" id="cUnit"></div>
        <div class="meta" id="cMeta"></div>
      </div>
      <div class="right"><span class="tag" id="cTag"></span><span class="fname" id="cFile"></span></div>
    </div>

    <div class="totals">
      <div class="tot in"><div><h3>Entradas</h3><div class="big" id="tInV"></div></div><div class="s" id="tInS"></div></div>
      <div class="tot out"><div><h3>Saídas</h3><div class="big" id="tOutV"></div></div><div class="s" id="tOutS"></div></div>
    </div>

    <div class="bar">
      <div class="tabs" role="tablist">
        <button class="tab on" data-t="E" role="tab">Entradas</button>
        <button class="tab" data-t="S" role="tab">Saídas</button>
        <button class="tab" data-t="A" role="tab">Apuração</button>
      </div>
      <div class="sp"></div>
      <input class="search" id="q" placeholder="Filtrar CFOP ou CST" aria-label="Filtrar por CFOP ou CST">
      <button class="btn" id="bCsv">Baixar CSV</button>
      <button class="btn" id="bCopy">Copiar</button>
      <button class="btn" id="bPrint">Imprimir</button>
    </div>

    <div id="view"></div>
    <p class="note" id="srcNote"></p>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const toC=s=>{if(!s)return 0;const n=parseFloat(String(s).replace(',','.'));return isNaN(n)?0:Math.round(n*100)};
const fmt=c=>(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=c=>'R$ '+fmt(c);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const cnpj=s=>{s=(s||'').replace(/\D/g,'');return s.length===14?s.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):s};
const MUN={3549904:'São José dos Campos',3550308:'São Paulo',3509502:'Campinas',3548500:'Santos',3518800:'Guarulhos',3554102:'Taubaté',3524402:'Jacareí'};
const AJ={SP90090104:'Valor correspondente à coluna Isentas/Não tributadas e Outras (artigos 214 e 215 do RICMS/00)',
          SP90090278:'Valor correspondente ao ICMS ST na condição de substituído (artigo 278, § 1º, do RICMS/00)'};

/* ================= PARSER ================= */
// campos por registro: índices de [BC ST, ICMS ST, IPI]; CST=2, CFOP=3, ALIQ=4, OPR=5, BC=6, ICMS=7
const REC={C190:[8,9,11],C590:[8,9,null],D590:[8,9,null],D190:[],C850:[],C890:[],C490:[],C390:[],D690:[]};
function parseSped(text){
  if(!/^\s*\|0000\|/.test(text.slice(0,200))) throw new Error('Este arquivo não parece um SPED Fiscal (não começa com o registro |0000|).');
  const d={head:null,fant:'',E:new Map(),S:new Map(),docsE:0,docsS:0,e110:null,aj:new Map(),lines:0};
  let ctx={dir:'S',sit:'00'};
  for(const line of text.split(/\r?\n/)){
    if(line.charCodeAt(0)!==124) continue;
    d.lines++;
    const p=line.split('|'), r=p[1];
    if(r==='0000'){d.head={cod_fin:p[3],ini:p[4],fim:p[5],nome:p[6],cnpj:p[7],uf:p[9],ie:p[10],mun:p[11],ver:p[2]};}
    else if(r==='0005'){d.fant=p[2]||'';}
    else if(r==='C100'||r==='C500'||r==='D100'||r==='D500'){
      ctx={dir:p[2]==='0'?'E':'S',sit:p[6]||'00'}; ctx.dir==='E'?d.docsE++:d.docsS++;
    }
    else if(r==='C800'){ctx={dir:'S',sit:p[3]||'00'};d.docsS++;}
    else if(r==='C860'){ctx={dir:'S',sit:'00'};d.docsS++;}
    else if(r==='C300'||r==='C400'||r==='C405'||r==='D600'){ctx={dir:'S',sit:'00'};}
    else if(r in REC){
      const f=REC[r], aliq=toC(p[4]);
      const key=(ctx.dir==='S'?ctx.sit+'|':'')+p[2]+'|'+p[3]+'|'+aliq;
      const m=d[ctx.dir];
      let o=m.get(key);
      if(!o){o={sit:ctx.sit,cst:p[2],cfop:p[3],aliq,opr:0,bc:0,icms:0,bcst:0,icmsst:0,ipi:0,n:0};m.set(key,o)}
      o.opr+=toC(p[5]);o.bc+=toC(p[6]);o.icms+=toC(p[7]);o.n++;
      if(f[0]) o.bcst+=toC(p[f[0]]);
      if(f[1]) o.icmsst+=toC(p[f[1]]);
      if(f[2]) o.ipi+=toC(p[f[2]]);
    }
    else if(r==='E110'){d.e110=p;}
    else if(r==='E111'){
      const k=p[2]||'—';let a=d.aj.get(k);
      if(!a){a={desc:AJ[k]||p[3]||'',v:0};d.aj.set(k,a)}
      a.v+=toC(p[4]);
    }
  }
  if(!d.head) throw new Error('Registro |0000| não encontrado.');
  return d;
}
const sorted=(m,s)=>[...m.values()].sort((a,b)=>
  (s?a.sit.localeCompare(b.sit):0)||a.cst.localeCompare(b.cst)||a.cfop.localeCompare(b.cfop)||a.aliq-b.aliq);
const sumRows=rows=>rows.reduce((t,o)=>{for(const k of ['opr','bc','icms','bcst','icmsst','ipi'])t[k]+=o[k];return t},{opr:0,bc:0,icms:0,bcst:0,icmsst:0,ipi:0});

/* ================= RENDER ================= */
let DATA=null,tab='E',fileName='';
const dtBR=s=>s&&s.length===8?`${s.slice(0,2)}/${s.slice(2,4)}/${s.slice(4)}`:s;
function showResult(){
  const h=DATA.head;
  $('#cName').textContent=h.nome;
  $('#cUnit').textContent=DATA.fant;
  const mun=MUN[h.mun]||('IBGE '+h.mun);
  $('#cMeta').innerHTML=`<span>CNPJ<b>${cnpj(h.cnpj)}</b></span><span>Inscrição estadual<b>${esc(h.ie)}</b></span><span>Município<b>${esc(mun)} - ${esc(h.uf)}</b></span><span>Período<b>${dtBR(h.ini)} a ${dtBR(h.fim)}</b></span>`;
  const t=$('#cTag');t.textContent=h.cod_fin==='1'?'Retificadora':'Arquivo original';t.classList.toggle('ret',h.cod_fin==='1');
  $('#cFile').textContent=fileName;$('#cFile').title=fileName;
  const e=sumRows([...DATA.E.values()]),s=sumRows([...DATA.S.values()]);
  $('#tInV').textContent=brl(e.opr);$('#tOutV').textContent=brl(s.opr);
  $('#tInS').innerHTML=`ICMS <b>${brl(e.icms)}</b><br>${DATA.docsE.toLocaleString('pt-BR')} documentos`;
  $('#tOutS').innerHTML=`ICMS <b>${brl(s.icms)}</b><br>${DATA.docsS.toLocaleString('pt-BR')} documentos`;
  $('#srcNote').textContent=`Totais somados dos registros C190, C390, C490, C590, C850, C890, D190, D590 e D690. ${DATA.lines.toLocaleString('pt-BR')} linhas lidas.`;
  const r=$('#result');r.classList.remove('show');void r.offsetWidth;r.classList.add('show');
  renderView();
}
const TITLES={E:'Registros fiscais dos documentos de entradas de mercadorias e aquisição de serviços',
              S:'Registros fiscais dos documentos de saídas de mercadorias e prestação de serviços'};
function filtered(){
  const q=$('#q').value.trim();
  let rows=sorted(DATA[tab],tab==='S');
  if(q) rows=rows.filter(o=>o.cfop.includes(q)||o.cst.includes(q));
  return rows;
}
const cell=(c,cls='')=>`<td class="${c===0?'z ':''}${cls}">${fmt(c)}</td>`;
function renderView(){
  const v=$('#view'),h=DATA.head;
  const isFilter=$('#q').value.trim()!=='';
  ['#q','#bCsv','#bCopy'].forEach(s=>$(s).style.display=tab==='A'?'none':'');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const meta=`<div class="rmeta"><span>Contribuinte <b>${esc(h.nome)}</b></span><span>CNPJ/CPF <b>${cnpj(h.cnpj)}</b></span><span>Inscrição estadual <b>${esc(h.ie)}</b></span><span>UF <b>${esc(h.uf)}</b></span><span>Município <b>${esc(MUN[h.mun]||h.mun)}</b></span><span>Período de apuração <b>${dtBR(h.ini)} a ${dtBR(h.fim)}</b></span></div>`;
  if(tab==='A'){
    const e=DATA.e110;
    const L=[[2,'Total dos débitos por saídas e prestações'],[3,'Ajustes a débito'],[4,'Total dos ajustes a débito'],[5,'Estornos de créditos'],[6,'Total dos créditos por entradas e aquisições'],[7,'Ajustes a crédito'],[8,'Total dos ajustes a crédito'],[9,'Estornos de débitos'],[10,'Saldo credor do período anterior'],[11,'Saldo devedor apurado'],[12,'Total de deduções'],[13,'ICMS a recolher'],[14,'Saldo credor a transportar'],[15,'Débitos especiais']];
    const must=new Set([2,6,13,14]);
    let rows=e?L.filter(([i])=>must.has(i)||toC(e[i])!==0).map(([i,t])=>`<div class="row ${i===14||i===13?'hi':''}"><span>${t}</span><b>${brl(toC(e[i]))}</b></div>`).join(''):'<div class="empty">Registro E110 não encontrado neste arquivo.</div>';
    let aj=[...DATA.aj.entries()].map(([k,a])=>`<tr><td>${esc(k)}</td><td style="text-align:left">${esc(a.desc)}</td>${cell(a.v)}</tr>`).join('');
    v.innerHTML=`<div class="report"><div class="rtitle">Apuração do ICMS e ajustes</div>${meta}<div class="apu">${rows}</div>
      <div class="sec">Resumo - ajustes</div><div class="scroll"><table><thead><tr><th>Código do ajuste</th><th style="text-align:left">Descrição do ajuste</th><th>Total do ajuste</th></tr></thead><tbody>${aj||'<tr><td colspan="3" class="empty">Nenhum ajuste (E111) neste arquivo.</td></tr>'}</tbody></table></div></div>`;
    return;
  }
  const rows=filtered(),tot=sumRows(rows),S=tab==='S';
  const body=rows.map(o=>`<tr>${S?`<td class="k">${o.sit}</td>`:''}<td class="${S?'k':'k'}" style="${S?'':'text-align:left;padding-left:22px'}">${o.cst}</td><td class="cfop">${o.cfop}</td>${cell(o.aliq)}${cell(o.opr)}${cell(o.bc)}${cell(o.icms)}${cell(o.bcst)}${cell(o.icmsst)}${cell(o.ipi)}</tr>`).join('');
  const head=`<tr>${S?'<th class="c" style="padding-left:22px;text-align:left">Situação</th>':''}<th ${S?'class="c"':''}>CST/ICMS</th><th class="c">CFOP</th><th>Alíquota ICMS</th><th>Total operação</th><th>Base de cálculo ICMS</th><th>Total ICMS</th><th>Base de cálculo ICMS ST</th><th>Total ICMS ST</th><th>Total IPI</th></tr>`;
  const span=S?3:2;
  v.innerHTML=`<div class="report"><div class="rtitle">${TITLES[tab]}</div>${meta}
    <div class="scroll"><table><thead>${head}</thead><tbody>${body||`<tr><td colspan="${S?10:9}" class="empty">Nenhum registro encontrado.</td></tr>`}</tbody>
    <tfoot><tr><td colspan="${span}" style="text-align:right">${isFilter?'Total do filtro':'Total'}</td><td></td>${cell(tot.opr)}${cell(tot.bc)}${cell(tot.icms)}${cell(tot.bcst)}${cell(tot.icmsst)}${cell(tot.ipi)}</tr></tfoot></table></div></div>`;
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderView()});
$('#q').oninput=()=>renderView();
function tableMatrix(){
  const S=tab==='S',rows=filtered(),tot=sumRows(rows);
  const hd=[...(S?['Situação']:[]),'CST/ICMS','CFOP','Alíquota ICMS','Total operação','Base de cálculo ICMS','Total ICMS','Base de cálculo ICMS ST','Total ICMS ST','Total IPI'];
  const m=rows.map(o=>[...(S?[o.sit]:[]),o.cst,o.cfop,fmt(o.aliq),fmt(o.opr),fmt(o.bc),fmt(o.icms),fmt(o.bcst),fmt(o.icmsst),fmt(o.ipi)]);
  m.push([...(S?['']:[]),'','Total','',fmt(tot.opr),fmt(tot.bc),fmt(tot.icms),fmt(tot.bcst),fmt(tot.icmsst),fmt(tot.ipi)]);
  return [hd,...m];
}
$('#bCsv').onclick=()=>{
  const csv='\ufeff'+tableMatrix().map(r=>r.map(c=>`"${c}"`).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`sped_${tab==='E'?'entradas':'saidas'}_${DATA.head.ini.slice(2)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$('#bCopy').onclick=async()=>{
  const t=tableMatrix().map(r=>r.join('\t')).join('\n');
  try{await navigator.clipboard.writeText(t);setStatus('Tabela copiada. Cole direto no Excel.','ok')}catch(e){setStatus('Não foi possível copiar neste navegador.','err')}
};
$('#bPrint').onclick=()=>window.print();

/* ================= TEMA ================= */
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('sped-theme',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('sped-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}

/* ================= HOMINHO + CESTA ================= */
const stage=$('#stage'),man=$('#man'),flip=$('#flip'),cesta=$('#cesta');
let patrolId=0,busy=false;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function manLeft(){return man.getBoundingClientRect().left-stage.getBoundingClientRect().left}
function bounds(){
  const sr=stage.getBoundingClientRect(),mr=$('#theme').getBoundingClientRect(),cr=cesta.getBoundingClientRect();
  const min=mr.right-sr.left+22,max=cr.left-sr.left-man.offsetWidth-24;
  return {min,max:Math.max(min+40,max),cesta:cr.left-sr.left-man.offsetWidth-6};
}
function face(right){flip.style.transform=right?'scaleX(1)':'scaleX(-1)'}
async function moveTo(x,speed,run){
  const from=manLeft();man.style.transition='none';man.style.left=from+'px';void man.offsetWidth;
  const dist=Math.abs(x-from),ms=Math.max(60,dist/speed*1000);
  face(x>=from);man.classList.remove('cheer','look');man.classList.add('walking');man.classList.toggle('running',!!run);
  man.style.transition=`left ${ms}ms linear`;man.style.left=x+'px';
  await sleep(ms);
}
async function patrol(){
  const id=++patrolId;
  if(reduce){man.classList.remove('walking');man.style.left=bounds().min+60+'px';return}
  man.style.left=man.style.left||'20%';
  while(id===patrolId){
    const b=bounds();
    await moveTo(b.max,52);if(id!==patrolId)return;
    man.classList.remove('walking');man.classList.add('look');await sleep(1300);if(id!==patrolId)return;
    await moveTo(b.min,52);if(id!==patrolId)return;
    man.classList.remove('walking');man.classList.add('look');await sleep(1000);
  }
}
function freeze(){patrolId++;const x=manLeft();man.style.transition='none';man.style.left=x+'px';void man.offsetWidth}

async function dropAnimation(from){
  freeze();
  const rim=$('#rim').getBoundingClientRect();
  const tx=rim.left+rim.width/2,ty=rim.top+rim.height/2;
  const sx=from?.x??innerWidth/2,sy=from?.y??innerHeight/2;
  const chip=document.createElement('div');chip.className='chip';chip.textContent='.txt';document.body.appendChild(chip);
  const mx=(sx+tx)/2,my=Math.min(sy,ty)-70;
  const fly=chip.animate([
    {transform:`translate(${sx}px,${sy}px) rotate(-10deg) scale(1)`,offset:0,easing:'ease-out'},
    {transform:`translate(${mx}px,${my}px) rotate(8deg) scale(1.08)`,offset:.45,easing:'cubic-bezier(.5,0,.9,.6)'},
    {transform:`translate(${tx}px,${ty-6}px) rotate(24deg) scale(.5)`,opacity:1,offset:.92},
    {transform:`translate(${tx}px,${ty+14}px) rotate(30deg) scale(.25)`,opacity:0,offset:1}
  ],{duration:900,fill:'forwards'});
  const run=(async()=>{const b=bounds();await moveTo(b.cesta,300,true)})();
  await fly.finished;chip.remove();
  cesta.classList.remove('shake');void cesta.offsetWidth;cesta.classList.add('shake');
  await run;
  man.classList.remove('walking','running');face(true);
  man.classList.add('cheer');
  await sleep(1350);
  man.classList.remove('cheer');
}

/* ================= FLUXO ================= */
function setStatus(t,cls=''){const s=$('#status');s.className='status '+cls;$('#stxt').textContent=t}
async function handleFile(file,from){
  if(busy||!file)return;
  busy=true;fileName=file.name;
  setStatus('Lendo '+file.name+'…','busy');
  const parsing=file.arrayBuffer().then(buf=>{
    const t0=performance.now();
    const text=new TextDecoder('windows-1252').decode(buf);
    const d=parseSped(text);d.ms=Math.round(performance.now()-t0);return d;
  });
  parsing.catch(()=>{});
  await dropAnimation(from);
  try{
    DATA=await parsing;
    tab='E';$('#q').value='';
    setStatus(`${DATA.head.nome}: ${DATA.lines.toLocaleString('pt-BR')} linhas lidas em ${DATA.ms} ms.`,'ok');
    showResult();
    $('#result').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
  }catch(err){
    setStatus(err.message||'Não foi possível ler o arquivo.','err');
  }
  busy=false;
  patrol();
}
$('#pick').onclick=()=>$('#file').click();
cesta.onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  const r=$('#pick').getBoundingClientRect();
  handleFile(f,{x:r.left+20,y:r.top+r.height/2});
};
let dragN=0;
addEventListener('dragenter',e=>{if(e.dataTransfer?.types?.includes('Files')){e.preventDefault();dragN++;stage.classList.add('drag')}});
addEventListener('dragover',e=>{e.preventDefault()});
addEventListener('dragleave',e=>{if(--dragN<=0){dragN=0;stage.classList.remove('drag')}});
addEventListener('drop',e=>{
  e.preventDefault();dragN=0;stage.classList.remove('drag');
  const f=e.dataTransfer?.files?.[0];if(f)handleFile(f,{x:e.clientX,y:e.clientY});
});
addEventListener('resize',()=>{if(!busy)patrol()});
face(true);man.style.left='20%';
patrol();
</script>
</body>
</html>
